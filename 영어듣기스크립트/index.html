<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0
    "
>

<title>영어 듣기 대본 학습</title>


<style>

/* =========================================================
   기본 색상 / 다크 테마
========================================================= */

:root {

    color-scheme: dark;

    --bg: #0d0f13;
    --bg2: #12151b;

    --card: #171a21;
    --card2: #1d212a;

    --line: #2a303b;

    --text: #f2f4f8;
    --subtext: #939bab;

    --primary: #7b8cff;

    /* 처음부터 맞은 정답 */
    --green: #38d67a;
    --green-bg: rgba(56, 214, 122, 0.12);

    /* 아직 틀린 답 */
    --red: #ff646d;
    --red-bg: rgba(255, 100, 109, 0.12);

    /* 틀렸다가 다시 맞힌 답 */
    --orange: #ffad42;
    --orange-bg: rgba(255, 173, 66, 0.14);

    /* 정답 확인으로 공개된 답 */
    --answer: #6da9ff;
    --answer-bg: rgba(109, 169, 255, 0.13);
}


* {

    box-sizing: border-box;

}


html {

    min-height: 100%;

    background: var(--bg);

}


body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Pretendard,
        "Noto Sans KR",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #171c29 0,
            var(--bg) 450px
        );

    color: var(--text);

}


button,
input {

    font-family: inherit;

}


button {

    -webkit-tap-highlight-color:
        transparent;

}


.hidden {

    display: none !important;

}



/* =========================================================
   상단바
========================================================= */

.topbar {

    height: 64px;

    position: sticky;

    top: 0;

    z-index: 100;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding-left:
        max(
            16px,
            env(safe-area-inset-left)
        );

    padding-right:
        max(
            16px,
            env(safe-area-inset-right)
        );

    background:
        rgba(
            13,
            15,
            19,
            0.92
        );

    border-bottom:
        1px solid var(--line);

    backdrop-filter:
        blur(14px);

    -webkit-backdrop-filter:
        blur(14px);

}


.top-title {

    font-size: 18px;

    font-weight: 850;

    letter-spacing: -0.4px;

}


.home-btn {

    min-height: 42px;

    border:
        1px solid var(--line);

    border-radius: 12px;

    padding:
        0 14px;

    background:
        var(--card2);

    color:
        var(--text);

    cursor: pointer;

    font-size: 14px;

    font-weight: 750;

}


.home-btn:active {

    transform:
        scale(0.96);

}



/* =========================================================
   전체 페이지 영역
========================================================= */

.page {

    width:
        min(
            920px,
            100%
        );

    margin:
        0 auto;

    padding:
        42px
        20px
        90px;

}



/* =========================================================
   듣기 대본 메인 화면
========================================================= */

.hero {

    text-align: center;

    margin:
        18px
        0
        40px;

}


.hero h1 {

    margin:
        0
        0
        10px;

    font-size:
        clamp(
            30px,
            6vw,
            40px
        );

    letter-spacing: -1px;

}


.hero p {

    margin: 0;

    color:
        var(--subtext);

    font-size: 15px;

}


.main-menu {

    display: grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0, 1fr)
        );

    gap: 18px;

}


.menu-card {

    min-height: 210px;

    padding:
        30px
        27px;

    border:
        1px solid var(--line);

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            var(--card2),
            var(--card)
        );

    cursor: pointer;

    transition:
        transform 0.16s,
        border-color 0.16s;

}


.menu-card:hover {

    border-color:
        #3c465c;

    transform:
        translateY(-3px);

}


.menu-card:active {

    transform:
        scale(0.985);

}


.menu-icon {

    font-size: 38px;

    margin-bottom: 18px;

}


.menu-card h2 {

    margin:
        0
        0
        8px;

    font-size: 22px;

    letter-spacing: -0.5px;

}


.menu-card p {

    margin: 0;

    color:
        var(--subtext);

    line-height: 1.6;

}



/* =========================================================
   듣기 번호 선택 화면
========================================================= */

.section-title {

    text-align: center;

    margin:
        12px
        0
        32px;

}


.section-title h1 {

    margin:
        0
        0
        7px;

    font-size: 30px;

}


.section-title p {

    margin: 0;

    color:
        var(--subtext);

}


.number-grid {

    display: grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0, 1fr)
        );

    gap: 14px;

}


.number-card {

    min-height: 120px;

    padding: 23px;

    border:
        1px solid var(--line);

    border-radius: 18px;

    background:
        var(--card);

    cursor: pointer;

    transition:
        transform 0.15s,
        border-color 0.15s;

}


.number-card:hover {

    border-color:
        #465171;

    transform:
        translateY(-3px);

}


.number-card:active {

    transform:
        scale(0.985);

}


.script-number {

    margin-bottom: 8px;

    color:
        var(--primary);

    font-size: 14px;

    font-weight: 900;

}


.number-card h2 {

    margin: 0;

    font-size: 20px;

}



/* =========================================================
   듣기 대본 학습 카드
========================================================= */

.content-card {

    padding: 40px;

    border:
        1px solid var(--line);

    border-radius: 22px;

    background:
        rgba(
            23,
            26,
            33,
            0.97
        );

}


.script-header {

    margin-bottom: 29px;

    padding-bottom: 21px;

    border-bottom:
        1px solid var(--line);

}


.script-label {

    margin-bottom: 6px;

    color:
        var(--primary);

    font-size: 13px;

    font-weight: 850;

}


.script-header h1 {

    margin: 0;

    font-size:
        clamp(
            23px,
            5vw,
            30px
        );

    line-height: 1.25;

}



/* =========================================================
   듣기 대본 문장
========================================================= */

.reading-paragraph {

    margin:
        0
        0
        17px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 20px;

    line-height: 1.85;

    color: #e8ebf1;

    overflow-wrap:
        break-word;

}



/* =========================================================
   빈칸 래퍼
========================================================= */

.blank-wrap {

    position: relative;

    display: inline-block;

    vertical-align:
        baseline;

    margin:
        0
        3px
        1px;

}



/* =========================================================
   빈칸 입력창
========================================================= */

.blank-input {

    height: 34px;

    min-width: 72px;

    max-width: 170px;

    padding:
        2px
        8px;

    border:
        1px solid #424957;

    border-bottom:
        2px solid #737c8c;

    border-radius: 7px;

    outline: none;

    background:
        #222731;

    color:
        #f3f5fa;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 17px;

    text-align: center;

    transition:
        background 0.15s,
        border-color 0.15s,
        color 0.15s;

}


.blank-input:focus {

    border-color:
        var(--primary);

    background:
        #282e3b;

}


/* 현재 오답 */

.blank-input.wrong {

    border-color:
        var(--red);

    background:
        var(--red-bg);

    color:
        #ff9399;

}


/* 첫 시도 정답 */

.blank-input.correct {

    border-color:
        var(--green);

    background:
        var(--green-bg);

    color:
        #7aefa5;

}


/* 틀린 뒤 다시 맞힌 정답 */

.blank-input.correct-after-wrong {

    border-color:
        var(--orange);

    background:
        var(--orange-bg);

    color:
        #ffc16d;

}


/* 정답 확인으로 공개된 답 */

.blank-input.revealed {

    border-color:
        var(--answer);

    background:
        var(--answer-bg);

    color:
        #98c3ff;

}


/* 맞힌 문제는 수정 불가 */

.blank-input.locked {

    cursor: default;

    opacity: 1;

    user-select: none;

}



/* =========================================================
   틀린 횟수 표시
========================================================= */

.mistake-count {

    position: absolute;

    top: -8px;

    right: -7px;

    min-width: 17px;

    height: 17px;

    padding:
        0 4px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 999px;

    background:
        var(--orange);

    color:
        #151515;

    font-family:
        Pretendard,
        sans-serif;

    font-size: 10px;

    font-weight: 900;

    line-height: 1;

    box-shadow:
        0
        0
        0
        2px
        var(--card);

}



/* =========================================================
   채점 결과
========================================================= */

.score-box {

    margin-top: 30px;

    padding: 17px;

    border:
        1px solid var(--line);

    border-radius: 14px;

    background:
        var(--card2);

    text-align: center;

    font-size: 16px;

    font-weight: 800;

    line-height: 1.6;

}



/* =========================================================
   하단 버튼
========================================================= */

.bottom-actions {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 10px;

    margin-top: 30px;

}


.action-btn {

    min-height: 46px;

    padding:
        0
        19px;

    border: 0;

    border-radius: 13px;

    cursor: pointer;

    font-size: 15px;

    font-weight: 800;

}


.action-btn:active {

    transform:
        scale(0.97);

}


.primary-btn {

    background:
        var(--primary);

    color: white;

}


.answer-btn {

    background:
        #2e72dc;

    color: white;

}


.secondary-btn {

    border:
        1px solid var(--line);

    background:
        var(--card2);

    color:
        var(--text);

}



/* =========================================================
   모바일 최적화
========================================================= */

@media (
    max-width: 680px
) {

    body {

        background:
            var(--bg);

    }


    .topbar {

        height: 58px;

        padding-left:
            max(
                12px,
                env(safe-area-inset-left)
            );

        padding-right:
            max(
                12px,
                env(safe-area-inset-right)
            );

    }


    .top-title {

        font-size: 16px;

    }


    .home-btn {

        min-height: 38px;

        padding:
            0 11px;

        font-size: 13px;

    }


    .page {

        padding:
            24px
            12px
            calc(
                105px +
                env(safe-area-inset-bottom)
            );

    }


    .hero {

        margin:
            10px
            0
            27px;

    }


    .hero p {

        font-size: 14px;

    }


    .main-menu {

        grid-template-columns:
            1fr;

        gap: 12px;

    }


    .menu-card {

        min-height: 0;

        padding:
            23px
            20px;

        border-radius: 17px;

    }


    .menu-icon {

        margin-bottom: 11px;

        font-size: 31px;

    }


    .menu-card h2 {

        font-size: 20px;

    }


    /* 모바일에서는 번호를 두 칸씩 표시 */

    .number-grid {

        grid-template-columns:
            repeat(
                2,
                minmax(0, 1fr)
            );

        gap: 9px;

    }


    .number-card {

        min-height: 92px;

        padding: 17px;

        border-radius: 15px;

    }


    .number-card h2 {

        font-size: 17px;

    }


    .section-title {

        margin:
            4px
            0
            24px;

    }


    .section-title h1 {

        font-size: 26px;

    }


    .content-card {

        padding:
            24px
            17px
            25px;

        border-radius: 17px;

    }


    .script-header {

        margin-bottom: 22px;

        padding-bottom: 17px;

    }


    .reading-paragraph {

        margin-bottom: 18px;

        font-size: 18px;

        line-height: 1.95;

    }


    .blank-wrap {

        margin-left: 2px;

        margin-right: 2px;

    }


    .blank-input {

        height: 37px;

        min-width: 68px;

        max-width: 145px;

        padding:
            3px
            7px;

        font-size: 16px;

        border-radius: 7px;

    }


    /*
       대본 학습 화면에서는
       버튼을 모바일 화면 아래에 고정
    */

    #studyPage
    .bottom-actions {

        position: fixed;

        z-index: 90;

        left: 0;

        right: 0;

        bottom: 0;

        margin: 0;

        padding:
            10px
            11px
            calc(
                10px +
                env(safe-area-inset-bottom)
            );

        display: grid;

        grid-template-columns:
            repeat(
                auto-fit,
                minmax(
                    90px,
                    1fr
                )
            );

        gap: 7px;

        background:
            rgba(
                13,
                15,
                19,
                0.95
            );

        border-top:
            1px solid var(--line);

        backdrop-filter:
            blur(14px);

        -webkit-backdrop-filter:
            blur(14px);

    }


    #studyPage
    .action-btn {

        width: 100%;

        min-height: 46px;

        padding:
            0 8px;

        font-size: 13px;

        border-radius: 11px;

    }


    .score-box {

        margin-top: 24px;

        font-size: 14px;

    }

}



/* =========================================================
   아주 작은 모바일 화면
========================================================= */

@media (
    max-width: 390px
) {

    .reading-paragraph {

        font-size: 17px;

    }


    .blank-input {

        max-width: 130px;

        font-size: 15px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     영어 듣기 대본 상단바
===================================================== -->

<header class="topbar">

    <div class="top-title">
        영어 듣기 대본
    </div>


    <button
        class="home-btn"
        onclick="
            location.href='../index.html'
        "
    >
        🏠 홈
    </button>

</header>



<!-- =====================================================
     영어 듣기 대본 메인 화면
===================================================== -->

<main
    id="mainPage"
    class="page"
>

    <div class="hero">

        <h1>
            영어 듣기 대본 학습
        </h1>

        <p>
            학습 방법을 선택하세요.
        </p>

    </div>


    <div class="main-menu">


        <!-- 대본 그대로 보기 -->

        <div
            class="menu-card"
            onclick="
                showNumberSelect('view')
            "
        >

            <div class="menu-icon">
                📖
            </div>

            <h2>
                영어 대본 보기
            </h2>

            <p>
                영어 듣기평가 대본을
                그대로 읽어봅니다.
            </p>

        </div>



        <!-- 대본 랜덤 빈칸 채우기 -->

        <div
            class="menu-card"
            onclick="
                showNumberSelect('blank')
            "
        >

            <div class="menu-icon">
                ✏️
            </div>

            <h2>
                영어 대본 빈칸 채우기
            </h2>

            <p>
                듣기평가 대본의 단어를
                랜덤 빈칸으로 연습합니다.
            </p>

        </div>


    </div>

</main>



<!-- =====================================================
     듣기 대본 번호 선택 화면
===================================================== -->

<main
    id="numberPage"
    class="page hidden"
>

    <div class="section-title">

        <h1 id="numberSelectTitle">
            대본 번호 선택
        </h1>

        <p>
            학습할 대본을 선택하세요.
        </p>

    </div>


    <!--
        content.js에 들어 있는
        홀수 번호를 자동으로 생성
    -->

    <div
        id="numberGrid"
        class="number-grid"
    ></div>


    <div class="bottom-actions">

        <button
            class="
                action-btn
                secondary-btn
            "
            onclick="
                showMain()
            "
        >
            ← 뒤로
        </button>

    </div>

</main>



<!-- =====================================================
     듣기 대본 학습 화면
===================================================== -->

<main
    id="studyPage"
    class="page hidden"
>

    <div class="content-card">


        <!-- 현재 듣기 번호 -->

        <div class="script-header">

            <div
                id="scriptLabel"
                class="script-label"
            ></div>

            <h1 id="scriptTitle"></h1>

        </div>



        <!-- 대본 또는 빈칸 대본 -->

        <div id="contentArea"></div>



        <!-- 채점 결과 -->

        <div
            id="scoreBox"
            class="
                score-box
                hidden
            "
        ></div>



        <!-- 학습 조작 버튼 -->

        <div class="bottom-actions">


            <!--
                빈칸 모드에서만 표시
            -->

            <button
                id="gradeBtn"
                class="
                    action-btn
                    primary-btn
                    hidden
                "
                onclick="
                    gradeAnswers()
                "
            >
                채점하기
            </button>



            <!--
                한 번 채점한 뒤부터 표시
            -->

            <button
                id="showAnswerBtn"
                class="
                    action-btn
                    answer-btn
                    hidden
                "
                onclick="
                    showAnswers()
                "
            >
                정답 확인
            </button>



            <!--
                새로운 랜덤 빈칸 생성
            -->

            <button
                id="retryBtn"
                class="
                    action-btn
                    secondary-btn
                    hidden
                "
                onclick="
                    generateBlankQuiz()
                "
            >
                🎲 새 문제
            </button>



            <!--
                듣기 번호 선택 화면으로 돌아가기
            -->

            <button
                class="
                    action-btn
                    secondary-btn
                "
                onclick="
                    backToNumbers()
                "
            >
                ← 번호 선택
            </button>


        </div>

    </div>

</main>



<!-- =====================================================
     듣기 대본 데이터
===================================================== -->

<script src="./content.js"></script>



<script>

/* =========================================================
   현재 학습 상태
========================================================= */

let currentMode = null;

let currentNumber = null;

let blankAnswers = [];

let hasGraded = false;

let answersShown = false;



/*
    전체 단어 중
    빈칸으로 만드는 비율
*/

const BLANK_RATIO = 0.20;


/*
    짧은 대본도 있으므로
    최소 빈칸 개수를 본문보다 조금 낮춤
*/

const MIN_BLANKS = 4;


/*
    한 대본에서
    최대 생성할 빈칸 개수
*/

const MAX_BLANKS = 20;



/* =========================================================
   페이지 숨기기
========================================================= */

function hideAllPages() {

    document
        .querySelectorAll(
            ".page"
        )
        .forEach(
            page => {

                page
                    .classList
                    .add(
                        "hidden"
                    );

            }
        );

}



/* =========================================================
   영어 듣기 대본 메인 화면
========================================================= */

function showMain() {

    currentMode = null;

    currentNumber = null;


    hideAllPages();


    document
        .getElementById(
            "mainPage"
        )
        .classList
        .remove(
            "hidden"
        );


    window.scrollTo(
        0,
        0
    );

}



/* =========================================================
   듣기 대본 번호 선택 화면
========================================================= */

function showNumberSelect(
    mode
) {

    currentMode = mode;


    hideAllPages();


    document
        .getElementById(
            "numberPage"
        )
        .classList
        .remove(
            "hidden"
        );


    document
        .getElementById(
            "numberSelectTitle"
        )
        .textContent =
        mode === "view"
            ? "영어 대본 보기"
            : "영어 대본 빈칸 채우기";


    renderNumberCards();


    window.scrollTo(
        0,
        0
    );

}



/* =========================================================
   content.js에 있는 대본 번호 자동 생성
========================================================= */

function renderNumberCards() {

    const grid =
        document
            .getElementById(
                "numberGrid"
            );


    grid.innerHTML = "";


    /*
        객체 키를 숫자로 변환 후
        오름차순 정렬
    */

    const numbers =
        Object
            .keys(
                ENGLISH_CONTENT
            )
            .map(
                Number
            )
            .sort(
                (a, b) =>
                    a - b
            );


    numbers.forEach(
        number => {


            const data =
                ENGLISH_CONTENT[
                    number
                ];


            const card =
                document
                    .createElement(
                        "div"
                    );


            card.className =
                "number-card";


            card.onclick =
                () =>
                    openScript(
                        number
                    );


            card.innerHTML = `
                <div
                    class="script-number"
                >
                    ${number}번
                </div>

                <h2>
                    ${data.title}
                </h2>
            `;


            grid.appendChild(
                card
            );

        }
    );

}

   번호 선택 화면으로 돌아가기
========================================================= */

function backToNumbers() {

    showNumberSelect(
        currentMode
    );

}



/* =========================================================
   선택한 듣기 대본 열기
========================================================= */

function openScript(
    number
) {

    currentNumber =
        number;


    hideAllPages();


    document
        .getElementById(
            "studyPage"
        )
        .classList
        .remove(
            "hidden"
        );


    const data =
        ENGLISH_CONTENT[
            number
        ];


    /*
        상단의 현재 번호
    */

    document
        .getElementById(
            "scriptLabel"
        )
        .textContent =

    /*
        대본 제목
    */

    document
        .getElementById(
            "scriptTitle"
        )
        .textContent =
        data.title;


    resetButtons();


    /*
        일반 대본 보기 /

    */

    ) {

    }

    else {

    }


    window.scrollTo(
        0,
        0
    );

}



/* =========================================================
   학습 버튼 상태 초기화
========================================================= */

function resetButtons() {

    [
        "gradeBtn",
        "showAnswerBtn",
        "retryBtn"
    ]
    .forEach(
        id => {

            document
                .getElementById(
                    id
                )
                .classList
                .add(
                    "hidden"
                );

        }
    );


    const scoreBox =
        document
            .getElementById(
                "scoreBox"
            );


    scoreBox
        .classList
        .add(

        );

}



/* =========================================================
   영어 듣기 대본 그대로 보기
========================================================= */

function renderScript() {

    const area =
        document
            .getElementById(
                "contentArea"
            );


    area.innerHTML = "";


    const data =
        ENGLISH_CONTENT[
            currentNumber
        ];


    data.blocks.forEach(
        block => {


            const element =
                createBlockElement();


            block.runs.forEach(
                run => {


                    const span =
                        document
                            .createElement(
                                "span"
                            );


                    span.textContent =
                        run.text;


                    /*
                        M:
                        W:
                        같은 화자 표시
                    */

                    if (
                        run.bold
                    ) {

                        span.style
                            .fontWeight =
                            "900";

                        span.style
                            .color =
                            "#9daaff";

                        span.style
                            .fontFamily =
                            "Pretendard, sans-serif";

                    }


                    if (
                        run.italic
                    ) {

                        span.style
                            .fontStyle =
                            "italic";

                    }


                    element
                        .appendChild(
                            span
                        );

                }
            );


            area.appendChild(
                element
            );

        }
    );

}



/* =========================================================
   대본 한 줄 생성
========================================================= */

function createBlockElement() {

    const element =
        document
            .createElement(
                "p"
            );


    element.className =
        "reading-paragraph";


    return element;

}



/* =========================================================
   새로운 랜덤 빈칸 문제 생성
========================================================= */

function generateBlankQuiz() {

    blankAnswers = [];

    hasGraded = false;

    answersShown = false;


    const scoreBox =
        document
            .getElementById(
                "scoreBox"
            );


    scoreBox
        .classList
        .add(
            "hidden"
        );


    scoreBox.innerHTML = "";


    const data =
        ENGLISH_CONTENT[
            currentNumber
        ];


    /*
        빈칸으로 만들 수 있는
        모든 단어 위치 저장
    */

    const candidates = [];


    data.blocks.forEach(
        (
            block,
            blockIndex
        ) => {


            block.runs.forEach(
                (
                    run,
                    runIndex
                ) => {


                    /*
                        M:
                        W:
                        등 굵은 화자 표시는
                        빈칸으로 만들지 않음
                    */

                    if (
                        run.bold ||
                        run.noBlank
                    ) {

                        return;

                    }


                    const tokens =
                        tokenize(
                            run.text
                        );


                    tokens.forEach(
                        (
                            token,
                            tokenIndex
                        ) => {


                            if (
                                isBlankCandidate(
                                    token
                                )
                            ) {

                                candidates
                                    .push({

                                        blockIndex,
                                        runIndex,
                                        tokenIndex

                                    });

                            }

                        }
                    );

                }
            );

        }
    );


    /*
        빈칸 후보 랜덤 섞기
    */

    shuffleArray(
        candidates
    );


    /*
        전체 후보의 20%
    */

    let blankCount =
        Math.round(

            candidates.length *

            BLANK_RATIO

        );


    /*
        최소 / 최대 빈칸 제한
    */

    blankCount =
        Math.max(
            MIN_BLANKS,
            blankCount
        );


    blankCount =
        Math.min(
            MAX_BLANKS,
            blankCount,
            candidates.length
        );


    const selected =
        new Set();


    candidates
        .slice(
            0,
            blankCount
        )
        .forEach(
            item => {

                selected.add(

                    locationKey(

                        item.blockIndex,

                        item.runIndex,

                        item.tokenIndex

                    )

                );

            }
        );


    renderBlankScript(
        selected
    );


    /*
        빈칸 모드에서
        채점 / 새 문제 버튼 표시
    */

    document
        .getElementById(
            "gradeBtn"
        )
        .classList
        .remove(
            "hidden"
        );


    document
        .getElementById(
            "showAnswerBtn"
        )
        .classList
        .add(
            "hidden"
        );


    document
        .getElementById(
            "retryBtn"
        )
        .classList
        .remove(
            "hidden"
        );

}



/* =========================================================
   랜덤 빈칸이 적용된 듣기 대본 출력
========================================================= */

function renderBlankScript(
    selected
) {

    const area =
        document
            .getElementById(
                "contentArea"
            );


    area.innerHTML = "";


    const data =
        ENGLISH_CONTENT[
            currentNumber
        ];


    let blankId = 0;


    data.blocks.forEach(
        (
            block,
            blockIndex
        ) => {


            const element =
                createBlockElement();


            block.runs.forEach(
                (
                    run,
                    runIndex
                ) => {


                    /*
                        화자 표시 또는
                        빈칸 제외 영역
                    */

                    if (
                        run.bold ||
                        run.noBlank
                    ) {


                        const span =
                            document
                                .createElement(
                                    "span"
                                );


                        span.textContent =
                            run.text;


                        if (
                            run.bold
                        ) {

                            span.style
                                .fontWeight =
                                "900";

                            span.style
                                .color =
                                "#9daaff";

                            span.style
                                .fontFamily =
                                "Pretendard, sans-serif";

                        }


                        if (
                            run.italic
                        ) {

                            span.style
                                .fontStyle =
                                "italic";

                        }


                        element
                            .appendChild(
                                span
                            );


                        return;

                    }


                    const tokens =
                        tokenize(
                            run.text
                        );


                    tokens.forEach(
                        (
                            token,
                            tokenIndex
                        ) => {


                            const key =
                                locationKey(

                                    blockIndex,

                                    runIndex,

                                    tokenIndex

                                );


                            /*
                                이번 랜덤 문제에서
                                선택된 단어
                            */

                            if (
                                selected.has(
                                    key
                                ) &&
                                isBlankCandidate(
                                    token
                                )
                            ) {


                                const parsed =
                                    splitWordPunctuation(
                                        token
                                    );


                                /*
                                    단어 앞 문장부호
                                */

                                if (
                                    parsed.before
                                ) {

                                    element
                                        .appendChild(

                                            document
                                                .createTextNode(
                                                    parsed.before
                                                )

                                        );

                                }


                                /*
                                    빈칸 + 틀린 횟수 숫자를
                                    함께 감싸는 영역
                                */

                                const wrapper =
                                    document
                                        .createElement(
                                            "span"
                                        );


                                wrapper.className =
                                    "blank-wrap";


                                const input =
                                    document
                                        .createElement(
                                            "input"
                                        );


                                input.type =
                                    "text";


                                input.className =
                                    "blank-input";


                                input.dataset.blankId =
                                    blankId;


                                /*
                                    지금까지
                                    틀린 횟수
                                */

                                input.dataset.wrongCount =
                                    "0";


                                /*
                                    스스로 맞혔거나
                                    정답 공개로 완료됐는지
                                */

                                input.dataset.solved =
                                    "false";


                                /*
                                    정답 확인 버튼으로
                                    공개된 문제인지
                                */

                                input.dataset.revealed =
                                    "false";


                                input.autocomplete =
                                    "off";


                                input.spellcheck =
                                    false;


                                /*
                                    정답 글자 수에 따라
                                    입력칸 폭 조절
                                */

                                const width =
                                    Math.max(

                                        72,

                                        Math.min(

                                            165,

                                            parsed.word.length *
                                            11 +
                                            28

                                        )

                                    );


                                input.style.width =
                                    width + "px";


                                /*
                                    해당 빈칸의 정답 저장
                                */

                                blankAnswers.push(
                                    parsed.word
                                );


                                blankId++;


                                wrapper
                                    .appendChild(
                                        input
                                    );


                                element
                                    .appendChild(
                                        wrapper
                                    );


                                /*
                                    단어 뒤 문장부호
                                */

                                if (
                                    parsed.after
                                ) {

                                    element
                                        .appendChild(

                                            document
                                                .createTextNode(
                                                    parsed.after
                                                )

                                        );

                                }

                            }

                            else {

                                /*
                                    빈칸으로 선택되지 않은
                                    원래 단어
                                */

                                element
                                    .appendChild(

                                        document
                                            .createTextNode(
                                                token
                                            )

                                    );

                            }

                        }
                    );

                }
            );


            area.appendChild(
                element
            );

        }
    );


    setupInputKeyboard();


    /*
        첫 번째 빈칸에
        자동 포커스
    */

    const first =
        area.querySelector(
            ".blank-input"
        );


    if (
        first
    ) {

        setTimeout(
            () => {

                first.focus();

            },
            80
        );

    }

}



/* =========================================================
   빈칸에서 Enter 키 동작
========================================================= */

function setupInputKeyboard() {

    const inputs =
        [
            ...document
                .querySelectorAll(
                    ".blank-input"
                )
        ];


    inputs.forEach(
        (
            input,
            index
        ) => {


            input.addEventListener(
                "keydown",
                event => {


                    if (
                        event.key !==
                        "Enter"
                    ) {

                        return;

                    }


                    event.preventDefault();


                    /*
                        아직 맞히지 않은
                        다음 빈칸 찾기
                    */

                    const next =
                        inputs
                            .slice(
                                index + 1
                            )
                            .find(
                                item =>
                                    !item.readOnly
                            );


                    if (
                        next
                    ) {

                        next.focus();

                    }

                    else {

                        /*
                            마지막 빈칸이면
                            바로 채점
                        */

                        gradeAnswers();

                    }

                }
            );

        }
    );

}



/* =========================================================
   빈칸 채점
========================================================= */

function gradeAnswers() {

    /*
        이미 정답 전체를 공개했다면
        다시 채점하지 않음
    */

    if (
        answersShown
    ) {

        return;

    }


    const inputs =
        [
            ...document
                .querySelectorAll(
                    ".blank-input"
                )
        ];


    let solvedCount = 0;


    inputs.forEach(
        input => {


            /*
                이미 맞혀서 잠긴 문제는
                다시 채점하지 않음
            */

            if (
                input.dataset.solved ===
                "true"
            ) {

                solvedCount++;

                return;

            }


            const id =
                Number(
                    input.dataset
                        .blankId
                );


            const answer =
                blankAnswers[
                    id
                ];


            const userAnswer =
                input
                    .value
                    .trim();


            input
                .classList
                .remove(
                    "wrong"
                );


            /*
                정답인 경우
            */

            if (
                normalizeAnswer(
                    userAnswer
                ) ===
                normalizeAnswer(
                    answer
                )
            ) {


                const wrongCount =
                    Number(
                        input.dataset
                            .wrongCount
                    );


                input.dataset.solved =
                    "true";


                /*
                    이전에 틀린 적이 있으면
                    주황색 정답
                */

                if (
                    wrongCount > 0
                ) {

                    input
                        .classList
                        .add(
                            "correct-after-wrong"
                        );


                    /*
                        2번 이상 틀렸을 때만
                        작은 숫자를 표시

                        1번 틀린 경우에는
                        숫자 표시하지 않음
                    */

                    if (
                        wrongCount >= 2
                    ) {

                        showMistakeCount(
                            input,
                            wrongCount
                        );

                    }

                }

                else {

                    /*
                        첫 시도에 맞으면
                        초록색 정답
                    */

                    input
                        .classList
                        .add(
                            "correct"
                        );

                }


                /*
                    이미 맞은 빈칸은
                    수정할 수 없게 잠금
                */

                lockInput(
                    input
                );


                solvedCount++;

            }

            else {

                /*
                    아직 오답인 경우
                */

                let wrongCount =
                    Number(
                        input.dataset
                            .wrongCount
                    );


                wrongCount++;


                input.dataset.wrongCount =
                    String(
                        wrongCount
                    );


                input
                    .classList
                    .add(
                        "wrong"
                    );

            }

        }
    );


    hasGraded = true;


    /*
        최초 채점 후,
        아직 틀린 문제가 남아 있으면
        정답 확인 버튼 표시
    */

    if (
        solvedCount <
        inputs.length
    ) {

        document
            .getElementById(
                "showAnswerBtn"
            )
            .classList
            .remove(
                "hidden"
            );

    }

    else {

        /*
            전부 맞혔다면
            정답 확인 버튼 필요 없음
        */

        document
            .getElementById(
                "showAnswerBtn"
            )
            .classList
            .add(
                "hidden"
            );

    }


    updateScore();


    /*
        아직 틀린 빈칸으로
        자동 이동
    */

    const nextWrong =
        inputs.find(
            input =>
                input.dataset.solved !==
                "true"
        );


    if (
        nextWrong
    ) {

        nextWrong.focus();

        nextWrong.select();

    }

}



/* =========================================================
   맞힌 빈칸 잠금
========================================================= */

function lockInput(
    input
) {

    input.readOnly = true;

    input.tabIndex = -1;

    input
        .classList
        .add(
            "locked"
        );

}



/* =========================================================
   2번 이상 틀린 횟수 표시
========================================================= */

function showMistakeCount(
    input,
    count
) {

    const wrapper =
        input.closest(
            ".blank-wrap"
        );


    if (
        !wrapper
    ) {

        return;

    }


    let badge =
        wrapper.querySelector(
            ".mistake-count"
        );


    if (
        !badge
    ) {

        badge =
            document
                .createElement(
                    "span"
                );


        badge.className =
            "mistake-count";


        wrapper.appendChild(
            badge
        );

    }


    badge.textContent =
        count;

}



/* =========================================================
   남은 빈칸 정답 확인
========================================================= */

function showAnswers() {

    /*
        최소 한 번 채점한 뒤에만
        정답을 확인할 수 있음
    */

    if (
        !hasGraded
    ) {

        return;

    }


    const inputs =
        [
            ...document
                .querySelectorAll(
                    ".blank-input"
                )
        ];


    inputs.forEach(
        input => {


            /*
                이미 스스로 맞힌 문제는
                그대로 유지
            */

            if (
                input.dataset.solved ===
                "true"
            ) {

                return;

            }


            const id =
                Number(
                    input.dataset
                        .blankId
                );


            const answer =
                blankAnswers[
                    id
                ];


            /*
                실제 정답 표시
            */

            input.value =
                answer;


            input.dataset.revealed =
                "true";


            input.dataset.solved =
                "true";


            input
                .classList
                .remove(
                    "wrong"
                );


            input
                .classList
                .add(
                    "revealed"
                );


            const wrongCount =
                Number(
                    input.dataset
                        .wrongCount
                );


            /*
                정답 확인한 경우에도
                2번 이상 틀렸다면
                횟수 표시
            */

            if (
                wrongCount >= 2
            ) {

                showMistakeCount(
                    input,
                    wrongCount
                );

            }


            lockInput(
                input
            );

        }
    );


    answersShown = true;


    /*
        정답 확인이 끝났으므로
        채점/정답 확인 버튼 숨김
    */

    document
        .getElementById(
            "showAnswerBtn"
        )
        .classList
        .add(
            "hidden"
        );


    document
        .getElementById(
            "gradeBtn"
        )
        .classList
        .add(
            "hidden"
        );


    updateScore();

}



/* =========================================================
   현재 학습 결과 표시
========================================================= */

function updateScore() {

    const inputs =
        [
            ...document
                .querySelectorAll(
                    ".blank-input"
                )
        ];


    let firstTryCorrect = 0;

    let retryCorrect = 0;

    let revealed = 0;

    let remaining = 0;


    inputs.forEach(
        input => {


            /*
                정답 확인으로 본 문제
            */

            if (
                input.dataset.revealed ===
                "true"
            ) {

                revealed++;

                return;

            }


            /*
                스스로 맞힌 문제
            */

            if (
                input.dataset.solved ===
                "true"
            ) {


                const wrongCount =
                    Number(
                        input.dataset
                            .wrongCount
                    );


                if (
                    wrongCount === 0
                ) {

                    firstTryCorrect++;

                }

                else {

                    retryCorrect++;

                }


                return;

            }


            /*
                아직 못 맞힌 문제
            */

            remaining++;

        }
    );


    const scoreBox =
        document
            .getElementById(
                "scoreBox"
            );


    const realCorrect =
        firstTryCorrect +
        retryCorrect;


    let html = `
        맞힌 문제
        <strong>
            ${realCorrect} / ${inputs.length}
        </strong>
    `;


    if (
        retryCorrect > 0
    ) {

        html +=
            ` · 재도전 성공 ${retryCorrect}`;

    }


    if (
        revealed > 0
    ) {

        html +=
            ` · 정답 확인 ${revealed}`;

    }


    if (
        remaining > 0
    ) {

        html +=
            ` · 남은 문제 ${remaining}`;

    }


    scoreBox.innerHTML =
        html;


    scoreBox
        .classList
        .remove(
            "hidden"
        );

}



/* =========================================================
   대본 문자열을 공백 단위로 분리

   공백 자체도 유지해서
   원래 문장 띄어쓰기를 보존
========================================================= */

function tokenize(
    text
) {

    return text.split(
        /(\s+)/
    );

}



/* =========================================================
   랜덤 빈칸으로 만들 수 있는 단어인지 검사
========================================================= */

function isBlankCandidate(
    token
) {

    const parsed =
        splitWordPunctuation(
            token
        );


    const word =
        parsed.word;


    if (
        !word
    ) {

        return false;

    }


    /*
        한 글짜 단어는
        빈칸에서 제외
    */

    if (
        word.length < 2
    ) {

        return false;

    }


    return (
        /[A-Za-z]/
            .test(
                word
            )
    );

}



/* =========================================================
   단어 앞/뒤의 문장부호 분리

   예:
   "sports."
      → sports / .

   "(Hello,"
      → ( / Hello / ,
========================================================= */

function splitWordPunctuation(
    token
) {

    const match =
        token.match(
            /^([^A-Za-z’'-]*)([A-Za-z][A-Za-z’'-]*)([^A-Za-z’'-]*)$/
        );


    if (
        !match
    ) {

        return {

            before: "",

            word: "",

            after: ""

        };

    }


    return {

        before:
            match[1],

        word:
            match[2],

        after:
            match[3]

    };

}



/* =========================================================
   정답 비교용 문자열 정리

   대소문자는 구분하지 않고
   곡선형 apostrophe도 일반 '로 통일
========================================================= */

function normalizeAnswer(
    text
) {

    return text
        .trim()
        .toLowerCase()
        .replace(
            /’/g,
            "'"
        );

}



/* =========================================================
   빈칸 후보 랜덤 섞기
========================================================= */

function shuffleArray(
    array
) {

    for (
        let i =
            array.length - 1;

        i > 0;

        i--
    ) {


        const j =
            Math.floor(

                Math.random() *

                (i + 1)

            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

}



/* =========================================================
   content.js 안에서
   각 단어의 고유 위치 생성
========================================================= */

function locationKey(
    blockIndex,
    runIndex,
    tokenIndex
) {

    return (
        blockIndex +
        ":" +
        runIndex +
        ":" +
        tokenIndex
    );

}
