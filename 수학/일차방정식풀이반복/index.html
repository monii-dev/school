<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일차방정식 연습</title>
<style>
:root{
  --bg:#0c1118;
  --panel:#161d27;
  --panel2:#10161e;
  --line:#2b3543;
  --text:#f5f7fb;
  --muted:#95a1b2;
  --yellow:#ffd54a;
  --yellow2:#ffbe19;
  --green:#63d99a;
  --red:#ff737f;
}
*{box-sizing:border-box}
html,body{
  margin:0;min-height:100%;
  font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;
  background:
    radial-gradient(circle at 15% 0%,rgba(255,213,74,.08),transparent 28%),
    var(--bg);
  color:var(--text)
}
body{display:flex;justify-content:center;padding:24px 14px}
.app{width:min(780px,100%);overflow:hidden}
.header{text-align:center;margin:8px 0 20px}
.header h1{margin:0;font-size:clamp(1.9rem,6vw,3rem);letter-spacing:-.06em}
.header p{margin:8px 0 0;color:var(--muted)}
.viewport{overflow:hidden;border-radius:24px}
.track{
  position:relative;
  width:100%;
}

.screen{
  display:none;
  width:100%;
}

.screen.active{
  display:block;
}

.screen.swipe-right{
  animation:swipeRightIn .48s cubic-bezier(.22,.75,.2,1) both;
}

/* 모든 화면 전환을 왼쪽에서 오른쪽으로 */
@keyframes swipeRightIn{
  0%{
    opacity:.25;
    transform:translateX(-100%);
  }
  100%{
    opacity:1;
    transform:translateX(0);
  }
}
.card{
  background:linear-gradient(155deg,var(--panel),#121821);
  border:1px solid var(--line);
  border-radius:24px;
  padding:clamp(18px,4vw,32px);
  box-shadow:0 18px 55px rgba(0,0,0,.28);
  min-height:540px
}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.progress{font-weight:900}
.type{
  font-size:.84rem;color:var(--yellow);
  border:1px solid rgba(255,213,74,.25);
  background:rgba(255,213,74,.06);
  padding:6px 10px;border-radius:999px
}
.bar{
  height:8px;
  background:#0b1016;
  border-radius:999px;
  overflow:hidden;
  margin-top:13px;
  position:relative;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.025)
}
.progress-segments{
  position:absolute;
  inset:0;
  display:flex;
  align-items:stretch;
}
.progress-seg{
  flex:0 0 10%;
  height:100%;
  opacity:0;
  transform:scaleX(.2);
  transform-origin:left center;
  filter:blur(.15px);
  animation:progressIn .35s cubic-bezier(.2,.75,.2,1) forwards;
  margin-right:-1px;
}
.progress-seg.correct{
  background:linear-gradient(90deg,
    rgba(255,190,25,.72) 0%,
    rgba(255,213,74,1) 42%,
    rgba(255,199,34,.92) 72%,
    rgba(255,213,74,.58) 100%);
  box-shadow:0 0 8px rgba(255,205,52,.28);
}
.progress-seg.wrong{
  background:linear-gradient(90deg,
    rgba(255,112,128,.55) 0%,
    rgba(255,122,142,1) 40%,
    rgba(255,105,127,.94) 72%,
    rgba(255,122,142,.55) 100%);
  box-shadow:0 0 8px rgba(255,112,132,.24);
}
@keyframes progressIn{
  to{opacity:1;transform:scaleX(1)}
}
.equation{
  text-align:center;
  font-size:clamp(2rem,7vw,3.65rem);
  font-weight:950;
  letter-spacing:-.04em;
  line-height:1.55;
  margin:58px 0 36px;
  min-height:98px;
  white-space:nowrap;
  width:100%;
  max-width:100%;
  overflow:visible
}
/* x는 따로 강조하지 않음 */
.x{color:inherit}

.input-row{
  display:flex;align-items:center;
  background:#0b1118;
  border:2px solid var(--line);
  border-radius:15px;padding:0 14px
}
.input-row:focus-within{
  border-color:var(--yellow2);
  box-shadow:0 0 0 4px rgba(255,190,25,.08)
}
.input-row b{font-size:1.25rem;color:var(--text)}
input{
  width:100%;background:transparent;border:0;outline:0;
  color:var(--text);
  font:800 1.2rem Pretendard,"Noto Sans KR",system-ui,sans-serif;
  padding:15px 10px
}
.primary{
  width:100%;margin-top:12px;
  border:0;border-radius:13px;padding:15px 16px;
  font-size:1rem;font-weight:900;cursor:pointer;
  background:linear-gradient(145deg,var(--yellow),var(--yellow2));
  color:#2c2300;
  transition:transform .12s,filter .12s
}
.primary:active{transform:scale(.985)}
.mini-message{
  height:26px;margin-top:10px;text-align:center;
  color:var(--red);font-weight:800;font-size:.9rem
}

/* 실제 분수 모양 */
.frac{
  display:inline-grid;
  grid-template-rows:auto auto;
  vertical-align:middle;
  text-align:center;
  line-height:1.02;
  margin:0 .08em;
  min-width:.72em;
  position:relative;
  top:.02em
}
.frac .num{
  border-bottom:1.7px solid currentColor;
  padding:0 .10em .08em
}
.frac .den{padding:.08em .10em 0}

/* 풀이 화면 */
.solution-head{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding-bottom:15px;border-bottom:1px solid var(--line)
}
.answer-state{font-weight:950;font-size:1.05rem}
.answer-state.ok{color:var(--green)}
.answer-state.no{color:var(--red)}
.correct-answer{font-weight:900;color:var(--yellow)}
.solution-area{
  position:relative;
  padding:28px 4px 10px;
  min-height:385px;
  overflow:hidden
}
.math-stack{
  display:flex;flex-direction:column;gap:5px;
  font-family:"Cambria Math","Times New Roman",serif;
  font-size:clamp(1.18rem,4.4vw,1.55rem)
}
.eqrow{
  display:grid;
  grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);
  align-items:center;
  min-height:44px;
  opacity:0;
  transform:translateY(-8px);
  filter:blur(3px)
}
.eqrow.show{
  animation:rowIn .36s ease forwards
}
.eqrow.instant{
  opacity:1;transform:none;filter:none
}
@keyframes rowIn{
  to{opacity:1;transform:none;filter:none}
}
.eqrow .l{text-align:right;padding-right:9px}
.eqrow .e{text-align:center;color:var(--muted)}
.eqrow .r{text-align:left;padding-left:9px}

.transfer{
  position:absolute;
  z-index:10;
  top:70px;
  padding:5px 9px;
  border-radius:9px;
  background:#232b36;
  border:1px solid #465264;
  box-shadow:0 8px 25px rgba(0,0,0,.35);
  font-family:"Cambria Math","Times New Roman",serif;
  font-weight:900;
  font-size:1.08rem;
  pointer-events:none;
  white-space:nowrap
}
.skip-note{
  text-align:center;color:var(--muted);font-size:.82rem;
  min-height:21px;margin-top:7px
}
.next-btn{
  opacity:0;transform:translateY(10px);pointer-events:none
}
.next-btn.show{
  animation:nextIn 10s ease forwards;
  pointer-events:auto
}
@keyframes nextIn{to{opacity:1;transform:none}}

/* 결과 */
.result-title{text-align:center;margin:12px 0 6px;font-size:2rem;letter-spacing:-.05em}
.result-score{text-align:center;color:var(--muted);margin-bottom:24px}
.result-score strong{display:block;color:var(--yellow);font-size:3.5rem;line-height:1.15}
.stats{display:grid;gap:10px;margin:22px 0}
.stat{
  display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;
  background:#10161e;border:1px solid var(--line);border-radius:14px;padding:15px
}
.stat .name{font-weight:900}
.stat .count{color:var(--muted)}
.stat .rate{font-weight:900;min-width:54px;text-align:right}
.result-actions{display:grid;gap:10px;margin-top:20px}
.secondary{
  width:100%;border:1px solid var(--line);border-radius:13px;padding:14px 16px;
  background:#232c39;color:var(--text);font-size:1rem;font-weight:900;cursor:pointer
}
.small-note{text-align:center;color:var(--muted);font-size:.84rem;margin-top:12px;min-height:20px}

@media(max-width:520px){
  body{padding:14px 10px}
  .card{padding:18px 14px;min-height:520px}
  .equation{margin:48px 0 30px}
  .stat{grid-template-columns:1fr auto}
  .stat .rate{grid-column:2}
  .stat .count{grid-row:2}
  .solution-area{padding-left:0;padding-right:0}
}
/* 시간 위치로 복원할 수 있는 풀이 플레이어 */
.solution-area.solution-player{padding:0;min-height:0;overflow:hidden;margin-top:18px;border:1px solid #303a4b;border-radius:17px;background:linear-gradient(145deg,#131b28,#0c121c);box-shadow:inset 0 1px 0 #ffffff04;--motion-font:28px;--motion-accent:#efc778}
.motion-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border-bottom:1px solid #ffffff08;min-height:45px}
.motion-speed{display:flex;align-items:center;gap:8px;color:#91a0b7;font-size:11px;white-space:nowrap}
.motion-speed output{width:37px;text-align:right;color:#efc778;font:11px ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
.solution-player input[type=range]{appearance:none;-webkit-appearance:none;height:4px;border:0;outline:0;border-radius:8px;padding:0;margin:0;cursor:pointer;touch-action:none;box-shadow:none;background:linear-gradient(90deg,var(--motion-accent) 0 var(--range-fill,0%),#2c3648 var(--range-fill,0%) 100%)}
.solution-player input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:12px;height:12px;border-radius:4px;background:#ecedf3;border:2px solid var(--motion-accent);box-shadow:0 0 0 3px #ffffff04}
.solution-player input[type=range]::-moz-range-thumb{width:8px;height:8px;border-radius:4px;background:#ecedf3;border:2px solid var(--motion-accent)}
.solution-player input[type=range]:focus-visible,.solution-player button:focus-visible{outline:2px solid #83dcdf;outline-offset:5px}
.motion-speed input[type=range]{width:105px;--motion-accent:#efc778}
.motion-time{font:10px ui-monospace,Consolas,monospace;color:#73839e;white-space:nowrap;font-variant-numeric:tabular-nums}
.motion-viewport{height:376px;overflow-x:hidden;overflow-y:auto;position:relative;scrollbar-width:thin;scrollbar-color:#354157 transparent;overscroll-behavior:contain}
.motion-world{position:relative;margin:0 14px;min-height:340px;padding:18px 4px 32px;isolation:isolate}
.solution-player .math-stack{position:relative;display:flex;gap:9px;font-family:"Cambria Math",Cambria,"Times New Roman",serif;font-size:var(--motion-font);line-height:1.18}
.motion-row{position:relative;flex:none;height:105px;opacity:0;transform:none;filter:none}
.motion-row-label{position:absolute;left:1px;top:5px;font:9px/1.4 Pretendard,"Noto Sans KR",system-ui,sans-serif;letter-spacing:.025em;color:#8592a9;white-space:nowrap}
.motion-row-label b{font:9px ui-monospace,Consolas,monospace;color:#a4aec0;margin-right:7px;font-weight:400}
.motion-equation{position:absolute;top:24px;bottom:3px;left:0;right:0;display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);align-items:center;font-family:"Cambria Math",Cambria,"Times New Roman",serif;font-size:var(--motion-font);line-height:1.18}
.motion-side{display:flex;align-items:center;gap:.06em;min-width:0;white-space:nowrap;overflow:visible}.motion-side.l{justify-content:flex-end}.motion-side.r{justify-content:flex-start}
.motion-equals{text-align:center;color:#7b899f;font-size:.9em}
.mterm{position:relative;display:inline-flex;align-items:center;gap:.035em;padding:.025em .025em;white-space:nowrap;overflow:visible;transform-origin:center center;flex:none;color:#edf0f7;background:transparent!important;border:0!important;box-shadow:none!important}
.math-sign{display:inline-flex;align-items:center;justify-content:center;width:.46em;height:.8em;flex:none;position:relative;overflow:visible}
.math-sign svg{width:100%;height:100%;stroke:currentColor;stroke-width:1.25;fill:none;stroke-linecap:round;overflow:visible}
.math-sign .sign-v{transform-origin:10px 10px}.math-sign .sign-h{transform-origin:10px 10px}
.term-body{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;position:relative;gap:.012em}
.math-x{font-style:italic}.motion-frac{display:inline-grid;grid-template-rows:1fr 1fr;position:relative;text-align:center;min-width:.85em;line-height:1.1;vertical-align:middle;align-self:center}
.motion-num,.motion-den{position:relative;display:flex;align-items:center;justify-content:center;white-space:nowrap;padding:0 .10em .08em;min-height:1.12em;gap:.02em}
.motion-den{padding:.08em .10em 0}.motion-bar{position:absolute;left:0;right:0;height:1.4px;top:50%;background:currentColor;border-radius:4px;transform-origin:center center}
.motion-work{position:absolute;left:4px;right:4px;z-index:3;pointer-events:none;will-change:transform,opacity;transform-origin:center center}
.motion-svg,.motion-fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.motion-svg{z-index:4}.motion-fx{z-index:5;font-family:"Cambria Math",Cambria,"Times New Roman",serif;font-size:var(--motion-font);line-height:1.18}
.motion-fx-group{position:absolute;inset:0;pointer-events:none}
.motion-ghost{position:absolute;display:flex;align-items:center;justify-content:center;transform-origin:center center;will-change:transform,opacity;background:transparent!important;border:0!important;box-shadow:none!important;color:inherit;white-space:nowrap}
.motion-ghost .mterm{color:inherit}.motion-badge{position:absolute;font:600 15px/1.2 "Cambria Math",Cambria,serif;white-space:nowrap;color:#83dcdf;transform-origin:center;pointer-events:none;text-shadow:0 0 12px #83dcdf2a}
.motion-multiplier{font-size:16px;letter-spacing:-.03em}.motion-spark{position:absolute;width:2px;height:2px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor;pointer-events:none;will-change:transform,opacity}
.motion-caption{position:relative;z-index:7;text-align:center;min-height:64px;padding:12px 15px 13px;border-top:1px solid #ffffff07;background:#0e1520}
.motion-caption-title{font-weight:600;font-size:12px;line-height:1.5;letter-spacing:-.025em;color:#dce4f1}.motion-caption-title strong{color:var(--motion-accent);font-weight:650}.motion-caption-detail{font-size:10px;color:#8391a8;line-height:1.55;margin-top:4px;word-break:keep-all}
.motion-transport{display:flex;align-items:center;gap:11px;padding:11px 12px;border-top:1px solid #ffffff07;background:#0a111b;min-height:52px}
.motion-transport button{display:flex;align-items:center;justify-content:center;gap:5px;flex:none;height:30px;background:#1c2738;border:1px solid #354056;color:#c4d0e4;border-radius:7px;font:600 10px Pretendard,"Noto Sans KR",system-ui,sans-serif;cursor:pointer;padding:0 10px;white-space:nowrap}
.motion-transport button:hover{color:#fff;background:#29364c}.motion-transport button:active{transform:scale(.96)}
.motion-transport svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linejoin:round;stroke-linecap:round}
.motion-transport #motionPause{width:29px;padding:0;background:transparent;border-color:transparent}.motion-transport #motionReplay{margin-left:auto}
.motion-transport #motionSeek{flex:1;min-width:30px;width:auto;height:5px}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.next-btn.show{animation:none;opacity:1;transform:none;pointer-events:auto}
@media(max-width:520px){.solution-area.solution-player{margin-top:14px;border-radius:13px}.motion-toolbar{padding:12px 10px;gap:7px}.motion-speed{gap:6px;font-size:10px}.motion-speed input[type=range]{width:82px}.motion-speed output{width:32px;font-size:10px}.motion-time{font-size:9px}.motion-world{margin:0 7px;padding-left:2px;padding-right:2px}.motion-work{left:2px;right:2px}.motion-viewport{height:356px}.motion-equation{grid-template-columns:minmax(0,1fr) 25px minmax(0,1fr)}.motion-transport{gap:9px;padding:10px}.motion-caption{padding:10px 10px 12px;min-height:68px}.motion-caption-title{font-size:11px}.motion-caption-detail{font-size:9px}.motion-badge{font-size:12px}.motion-multiplier{font-size:13px}.motion-row-label{font-size:8px}.motion-row-label b{font-size:8px}}

</style>
</head>
<body>
<div class="app">
  <header class="header">
    <h1>일차방정식 연습</h1>
    <p>일반 · 소수 계수 · 분수 계수</p>
  </header>

  <div class="viewport">
    <div class="track" id="track">

      <!-- 문제 -->
      <section class="screen">
        <div class="card">
          <div class="top">
            <div class="progress" id="progress">1 / 10</div>
            <div class="type" id="typeBadge">일반</div>
          </div>
          <div class="bar"><div class="progress-segments" id="progressSegments"></div></div>

          <div class="equation" id="equation"></div>

          <div class="input-row">
           
            <input id="answer" autocomplete="off" inputmode="text"
                   placeholder="정답 입력">
          </div>

          <button class="primary" id="checkBtn">확인</button>
          <div class="mini-message" id="problemMessage"></div>
        </div>
      </section>

      <!-- 풀이 -->
      <section class="screen">
        <div class="card">
          <div class="solution-head">
            <div class="answer-state" id="answerState">정답</div>
            <div class="correct-answer" id="correctAnswer"></div>
          </div>

          <div class="solution-area solution-player" id="solutionArea" aria-label="풀이 애니메이션 플레이어">
            <div class="motion-toolbar">
              <label class="motion-speed" for="motionSpeed">배속 <input id="motionSpeed" type="range" min="0.25" max="3" step="0.05" value="1" aria-label="풀이 재생 배속"><output id="motionSpeedValue" for="motionSpeed">1.00×</output></label>
              <span class="motion-time" id="motionTime">00:00 / 00:00</span>
            </div>
            <div class="motion-viewport" id="motionViewport">
              <div class="motion-world" id="motionWorld">
                <div class="math-stack" id="mathStack"></div>
                <svg class="motion-svg" id="motionSvg" aria-hidden="true"></svg>
                <div class="motion-fx" id="motionFx" aria-hidden="true"></div>
              </div>
            </div>
            <div class="motion-caption" role="status" aria-live="polite"><div class="motion-caption-title" id="motionTitle">풀이 준비 중</div><div class="motion-caption-detail" id="motionDetail">아래 슬라이더로 원하는 순간을 다시 볼 수 있어요.</div></div>
            <div class="motion-transport">
              <button id="motionPause" title="재생 / 일시정지 (Space)" aria-label="일시정지"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
              <input id="motionSeek" type="range" min="0" max="1000" step="1" value="0" aria-label="풀이 재생 위치" aria-valuetext="처음">
              <button id="motionReplay" title="풀이 애니메이션 처음부터 다시 보기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg>다시보기</button>
            </div>
          </div>

          <div class="skip-note" id="skipNote">Enter를 누르면 풀이 애니메이션을 건너뜁니다.</div>
          <button class="primary next-btn" id="nextBtn">다음 문제</button>
        </div>
      </section>

      <!-- 결과 -->
      <section class="screen">
        <div class="card">
          <h2 class="result-title">10문제 완료</h2>
          <div class="result-score">
            <strong id="totalScore">0 / 10</strong>
            유형별 결과
          </div>
          <div class="stats" id="stats"></div>
          <div class="result-actions">
            <button class="primary" id="weakBtn">틀린 유형 위주 더 풀기</button>
            <button class="secondary" id="continueBtn">그냥 이어서 풀기</button>
          </div>
          <div class="small-note" id="resultNote"></div>
        </div>
      </section>

    </div>
  </div>
</div>

<script>
/* ---------- 유리수 ---------- */
function gcd(a,b){
  a=Math.abs(a); b=Math.abs(b);
  while(b){ [a,b]=[b,a%b]; }
  return a||1;
}
function R(n,d=1){
  if(d<0){n=-n;d=-d}
  const g=gcd(n,d);
  return {n:n/g,d:d/g};
}
const add=(a,b)=>R(a.n*b.d+b.n*a.d,a.d*b.d);
const sub=(a,b)=>R(a.n*b.d-b.n*a.d,a.d*b.d);
const mul=(a,b)=>R(a.n*b.n,a.d*b.d);
const div=(a,b)=>R(a.n*b.d,a.d*b.n);
const same=(a,b)=>a.n===b.n&&a.d===b.d;
const Z=()=>R(0);

function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function nonzeroInt(a,b){let n=0;while(n===0)n=randInt(a,b);return n}
function pick(a){return a[randInt(0,a.length-1)]}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=randInt(0,i);
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

const TYPES=["normal","decimal","fraction"];
const TYPE_NAME={normal:"일반",decimal:"소수 계수",fraction:"분수 계수"};

function coeff(type){
  if(type==="normal") return R(nonzeroInt(-9,9));

  if(type==="decimal"){
    let n;
    do n=nonzeroInt(-29,29); while(n%10===0);
    return R(n,10);
  }

  let d=randInt(2,9),n;
  do n=nonzeroInt(-12,12); while(n%d===0);
  return R(n,d);
}

function constant(){
  return R(randInt(-12,12));
}

function fractionHTML(r){
  if(r.d===1) return String(r.n);
  return `<span class="frac"><span class="num">${r.n}</span><span class="den">${r.d}</span></span>`;
}

function decimalString(r){
  const v=r.n/r.d;
  const s=v.toFixed(5).replace(/\.?0+$/,"");
  return s;
}

function ratHTML(r,type){
  if(r.d===1) return String(r.n);
  if(type==="decimal") return decimalString(r);
  return fractionHTML(r);
}
function absR(r){return R(Math.abs(r.n),r.d)}
function isOne(r){return r.n===r.d}
function isMinusOne(r){return r.n===-r.d}

function termHTML(term,type,first=false){
  const neg=term.v.n<0;
  const a=absR(term.v);
  let body;

  if(term.k==="x"){
    const c=isOne(a)?"":ratHTML(a,type);
    body=`${c}<span class="x">x</span>`;
  }else{
    body=ratHTML(a,type);
  }

  if(first) return (neg?"−":"")+body;
  return ` ${neg?"−":"+"} ${body}`;
}

function exprHTML(terms,type){
  const list=terms.filter(t=>t.v.n!==0);
  if(!list.length) return "0";
  return list.map((t,i)=>termHTML(t,type,i===0)).join("");
}

function linearHTML(a,b,type){
  let out=[];

  if(a.n!==0){
    const neg=a.n<0;
    const aa=absR(a);
    const c=isOne(aa)?"":ratHTML(aa,type);
    out.push((neg?"−":"")+c+"x");
  }

  if(b.n!==0){
    const neg=b.n<0;
    const bb=absR(b);
    const body=ratHTML(bb,type);

    if(!out.length) out.push((neg?"−":"")+body);
    else out.push((neg?" − ":" + ")+body);
  }

  return out.join("")||"0";
}

function xCoeffHTML(a,type){
  if(isOne(a)) return "x";
  if(isMinusOne(a)) return "−x";
  return ratHTML(a,type)+"x";
}

function signedAbsTermHTML(v,isX,type){
  const sign=v.n<0?"−":"+";
  const a=absR(v);
  const core=isX
    ? ((isOne(a)?"":ratHTML(a,type))+"x")
    : ratHTML(a,type);
  return {before:`${sign} ${core}`,after:`${sign==="+"?"−":"+"} ${core}`};
}

/* ---------- 문제 생성: 전체 항 3~5개 ---------- */
function sideSums(side){
  return side.reduce((s,t)=>{
    if(t.k==="x") s.a=add(s.a,t.v);
    else s.b=add(s.b,t.v);
    return s;
  },{a:Z(),b:Z()});
}

function generateProblem(type){
  const solution=R(randInt(-12,12));
  const total=randInt(3,5);

  // 최소: 왼쪽 x, 오른쪽 x, 그리고 상수항 1개
  const left=[{k:"x",v:coeff(type)}];
  const right=[{k:"x",v:coeff(type)}];

  const slots=total-2;
  for(let i=0;i<slots;i++){
    const target=Math.random()<.5?left:right;
    // 상수가 반드시 하나는 생기도록 마지막 슬롯 보정
    const alreadyConst=[...left,...right].some(t=>t.k==="c");
    const mustConst=(i===slots-1 && !alreadyConst);
    target.push(mustConst || Math.random()<.58
      ? {k:"c",v:constant()}
      : {k:"x",v:coeff(type)});
  }

  let L=sideSums(left),Rr=sideSums(right);

  // x계수 합이 같으면 한쪽 계수 변경
  if(same(L.a,Rr.a)){
    left[0].v=add(
      left[0].v,
      type==="normal"?R(1):type==="decimal"?R(1,10):R(1,2)
    );
    L=sideSums(left);
    Rr=sideSums(right);
  }

  // 존재하는 상수항 하나를 조절해 정수해 보장
  const leftConst=left.findIndex(t=>t.k==="c");
  const rightConst=right.findIndex(t=>t.k==="c");

  if(rightConst>=0){
    // D = (A-C)s + B
    const wantedD=add(mul(sub(L.a,Rr.a),solution),L.b);
    const otherD=sub(Rr.b,right[rightConst].v);
    right[rightConst].v=sub(wantedD,otherD);
  }else{
    // B = D - (A-C)s
    const wantedB=sub(Rr.b,mul(sub(L.a,Rr.a),solution));
    const otherB=sub(L.b,left[leftConst].v);
    left[leftConst].v=sub(wantedB,otherB);
  }

  shuffle(left);shuffle(right);
  L=sideSums(left);Rr=sideSums(right);

  return {
    type,solution,left,right,
    A:L.a,B:L.b,C:Rr.a,D:Rr.b
  };
}

function chooseType(){
  if(mode!=="weak" || !lastStats) return pick(TYPES);

  const weights=TYPES.map(t=>{
    const s=lastStats[t];
    const wrong=s.total-s.correct;
    const rate=s.total?wrong/s.total:0;
    return 1+wrong*4+rate*3;
  });

  const sum=weights.reduce((a,b)=>a+b,0);
  let r=Math.random()*sum;

  for(let i=0;i<TYPES.length;i++){
    r-=weights[i];
    if(r<=0)return TYPES[i];
  }
  return TYPES[2];
}

function parseAnswer(s){
  s=s.trim().replace(/\s+/g,"").replace("−","-");
  if(!s)return null;

  if(/^[-+]?\d+\/[-+]?\d+$/.test(s)){
    const [n,d]=s.split("/").map(Number);
    if(!d)return null;
    return R(n,d);
  }

  if(/^[-+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)){
    if(s.includes(".")){
      const neg=s.startsWith("-");
      const clean=s.replace(/^[-+]/,"");
      const [a,b=""]=clean.split(".");
      const n=Number((a||"0")+b)*(neg?-1:1);
      return R(n,10**b.length);
    }
    return R(Number(s));
  }

  return null;
}

const motionPlayer=new SolutionPlayer();
let nextButtonTimer=null;

function resetSolution(){
  animationToken++;
  animating=false;
  if(nextButtonTimer){clearTimeout(nextButtonTimer);nextButtonTimer=null}
  motionPlayer.stop();
  $('nextBtn').classList.remove('show');
}

function playSolution(){
  if(currentScreen!=='solution')return;
  const token=++animationToken;
  motionPlayer.load(current);

  if(nextButtonTimer)clearTimeout(nextButtonTimer);
  nextButtonTimer=setTimeout(()=>{
    nextButtonTimer=null;
    if(token!==animationToken || currentScreen!=='solution')return;
    $('nextBtn').classList.add('show');
  },1000);
}

function skipSolution(){
  if(currentScreen!=='solution')return;
  if(!motionPlayer.plan)motionPlayer.load(current);
  motionPlayer.playing=false;
  motionPlayer.seek(motionPlayer.duration);
}
let motionScrubbing=false,motionResumeAfterSeek=false;
$('motionSpeed').addEventListener('input',e=>ANIMATION_CONFIG.tempo=Number(e.target.value));
$('motionPause').addEventListener('click',()=>motionPlayer.toggle());
$('motionReplay').addEventListener('click',()=>motionPlayer.replay());
$('motionSeek').addEventListener('pointerdown',()=>{motionScrubbing=true;motionResumeAfterSeek=motionPlayer.playing;motionPlayer.playing=false;motionPlayer.updateControls()});
$('motionSeek').addEventListener('input',e=>{if(!motionScrubbing)motionPlayer.playing=false;motionPlayer.seek(Number(e.target.value))});
function finishMotionScrub(){if(!motionScrubbing)return;motionScrubbing=false;if(motionResumeAfterSeek&&motionPlayer.time<motionPlayer.duration){motionPlayer.playing=true;motionPlayer.last=performance.now()}motionPlayer.updateControls()}

document.addEventListener('visibilitychange',()=>motionPlayer.last=performance.now());
const motionResize=new ResizeObserver(()=>{if(!motionPlayer.plan)return;const width=$('motionViewport').clientWidth;if(width&&Math.abs(width-motionPlayer.width)>1){const time=motionPlayer.time;motionPlayer.build();motionPlayer.seek(time)}});motionResize.observe($('motionViewport'));

/* ---------- 채점 / 이동 ---------- */
function checkAnswer(){
  if(currentScreen!=="problem" || !questionReady)return;
  const value=parseAnswer($("answer").value);

  if(!value){
    $("problemMessage").textContent="정답을 입력해 주세요.";
    $("answer").focus();
    return;
  }

  questionReady=false;
  $("checkBtn").disabled=true;
  const correct=same(value,current.solution);
  batchStats[current.type].total++;
  if(correct)batchStats[current.type].correct++;

  // 진행 바는 문제를 "확인"한 순간에만 10%씩 채운다.
  addProgressResult(correct);

  $("answerState").textContent=correct?"정답":"오답";
  $("answerState").className="answer-state "+(correct?"ok":"no");
  $("correctAnswer").innerHTML=`x = ${ratHTML(current.solution,current.type)}`;

  resetSolution();
  setScreen("solution");

  playSolution();
}

function nextProblem(){
  if(currentScreen!=="solution")return;

  if(nextButtonTimer){clearTimeout(nextButtonTimer);nextButtonTimer=null}
  animationToken++;
  motionPlayer.playing=false;

  if(qIndex>=9){
    showResults();
    return;
  }

  questionReady=false;
  qIndex++;
  setScreen("problem");
  setTimeout(newQuestion,250);
}

function showResults(){
  motionPlayer.playing=false;
  lastStats=JSON.parse(JSON.stringify(batchStats));

  const totalCorrect=TYPES.reduce((n,t)=>n+batchStats[t].correct,0);
  $("totalScore").textContent=`${totalCorrect} / 10`;

  $("stats").innerHTML=TYPES.map(t=>{
    const s=batchStats[t];
    const rate=s.total?Math.round(s.correct/s.total*100):0;
    return `<div class="stat">
      <div class="name">${TYPE_NAME[t]}</div>
      <div class="count">${s.correct} / ${s.total}</div>
      <div class="rate">${rate}%</div>
    </div>`;
  }).join("");

  const hasWrong=TYPES.some(t=>batchStats[t].total-batchStats[t].correct>0);
  $("weakBtn").disabled=!hasWrong;
  $("weakBtn").style.filter=hasWrong?"":"grayscale(1)";
  $("resultNote").textContent=hasWrong?"":"틀린 문제가 없습니다.";

  setScreen("result");
}

function startBatch(nextMode){
  motionPlayer.stop();
  questionReady=false;
  mode=nextMode;
  qIndex=0;
  batchStats=freshStats();
  progressResults=[];
  renderProgress();
  setScreen("problem");
  setTimeout(newQuestion,250);
}

window.addEventListener("resize",()=>requestAnimationFrame(fitEquation));

/* ---------- 이벤트 ---------- */
$("checkBtn").addEventListener("click",checkAnswer);
$("nextBtn").addEventListener("click",nextProblem);
$("continueBtn").addEventListener("click",()=>startBatch("random"));
$("weakBtn").addEventListener("click",()=>startBatch("weak"));

document.addEventListener("keydown",e=>{
  if(e.repeat || e.ctrlKey || e.altKey || e.metaKey)return;
  const interactive=e.target.closest && e.target.closest('button,select,textarea,[contenteditable="true"]');
  if(interactive)return;
  if(currentScreen==="solution" && e.target.closest && e.target.closest('input'))return;
  if(currentScreen==="solution" && e.code==="Space"){
    e.preventDefault();motionPlayer.toggle();return;
  }
  if(e.key!=="Enter")return;

  /* Enter는 현재 화면의 주 버튼을 누른 것과 동일하게 동작 */
  if(currentScreen==="problem"){
    e.preventDefault();
    $("checkBtn").click();
    return;
  }

  if(currentScreen==="solution" && $("nextBtn").classList.contains("show")){
    e.preventDefault();
    $("nextBtn").click();
    return;
  }
});

setScreen("problem",false);
renderProgress();
newQuestion();
</script>
</body>
</html>
