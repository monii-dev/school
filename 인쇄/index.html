nter}.ratio-track-shell{position:absolute;left:2px;right:2px;top:50%;height:18px;transform:translateY(-50%);border-radius:999px;background:#242e3c;overflow:hidden}.ratio-track{position:absolute;inset:0;background:linear-gradient(90deg,#ffd54a 0 var(--cut1),#63d9d1 var(--cut1) var(--cut2),#b69cff var(--cut2) 100%)}.ratio-handle{position:absolute;left:0;width:28px;height:28px;border-radius:9px;background:#f8fafc;box-shadow:0 3px 14px #0008;z-index:3;cursor:grab}.ratio-handle-a{top:0;border:3px solid #63d9d1;transform:translateX(-50%)}.ratio-handle-b{bottom:0;border:3px solid #b69cff;transform:translateX(-50%)}.ratio-axis{display:flex;justify-content:space-between;color:#718096;font-size:12px}.ratio-help,.ratio-summary{font-size:13px;color:#aab5c8;text-align:center;margin-top:12px}.ratio-summary{padding:11px;background:#0d131b;border-radius:12px}#preview{background:#fff;color:#111;border-radius:12px;padding:28px;font-family:'Malgun Gothic',Arial,sans-serif}#preview h2{margin-top:0}#preview .item{break-inside:avoid;display:flex;gap:9px;border-bottom:1px solid #eee;padding:16px 0;line-height:1.65}#preview .question{flex:1}#preview .workline{min-width:55px}.frac{display:inline-grid;vertical-align:middle;text-align:center;line-height:1}.frac .num{border-bottom:1px solid currentColor}.steps{color:#555;font-size:12px}.answerItem{display:flex;gap:13px;padding:11px 0;border-bottom:1px solid #ddd}.pageHead{display:flex;justify-content:space-between;align-items:center;color:#666;font-size:12px}.printTitle{color:#111}.tip{padding:12px;background:#28313e;border-radius:10px;color:#bfcddd;font-size:13px}@media print{body{background:white;color:black}main{max-width:none;margin:0;padding:0}.noprint{display:none!important}#preview{padding:0;border:0;border-radius:0}#preview .item{padding:13px 0;page-break-inside:avoid} @page{size:A4;margin:16mm}}

</style></head><body><main><div class="noprint"><a class="back" href="../index.html">← 홈</a><h1>문제지 · 답안지 만들기</h1><p class="muted">과목 → 유형 → 세부 설정 → 출력. 인터넷 요청 없이 작동합니다.</p><section class="card" id="settings"><div class="grid"><label>과목<select id="subject"><option value="math">수학</option><option value="english">영어</option></select></label><label>유형<select id="unit"></select></label></div><div id="custom"></div><div class="grid"><label>문제 수<input id="count" type="number" min="1" max="200" value="20"></label></div><div class="row"><a class="btn secondary" href="../index.html" style="text-decoration:none">홈</a><button class="btn" id="next">다음 →</button></div></section><section id="actions" class="card hidden"><h2>출력하기</h2><p class="muted" id="summary"></p><div class="grid"><button class="btn" id="problemPdf">문제 PDF로 저장</button><button class="btn secondary" id="problemPrint">문제 인쇄</button><button class="btn" id="answerPdf">답안지 PDF로 저장</button><button class="btn secondary" id="answerPrint">답안지 인쇄</button></div><div class="tip">PDF 저장은 파일을 바로 다운로드합니다. 인쇄 버튼을 누르면 프린터 선택 창이 열립니다.</div><div class="row" style="margin-top:16px"><button class="btn secondary" id="edit">← 설정 변경</button><a class="btn secondary" href="../index.html" style="text-decoration:none">홈</a></div></section><div id="previewTabs" class="preview-tabs hidden noprint" role="group" aria-label="미리보기 선택"><button type="button" class="btn active" id="previewProblem" aria-pressed="true">문제지</button><button type="button" class="btn" id="previewAnswer" aria-pressed="false">답안지</button></div></div><section id="preview" class="hidden"></section></main>
