<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1019">
  <title>일정 안내</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1019;--surface:#151d2b;--surface2:#1b2535;--line:#2b3749;--text:#f3f6fc;--muted:#9caac0;--gold:#ffd36b;--gold2:#f2ad42;--shadow:0 24px 70px #0006}
    *{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse 65% 32% at 50% -8%,#31416066,transparent 78%),radial-gradient(ellipse 50% 45% at 95% 75%,#192e4050,transparent),var(--bg);font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;color:var(--text);overflow-x:hidden}
    button{font:inherit}button:focus-visible{outline:3px solid var(--gold);outline-offset:4px}.container{width:min(790px,calc(100% - 36px));margin:0 auto;padding:76px 0 84px}.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin-bottom:19px}.eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 13px #ffd36b99}.hero{padding:0 3px 32px;border-bottom:1px solid var(--line)}h1{font-size:clamp(34px,6.5vw,57px);font-weight:850;line-height:1.17;letter-spacing:-.065em;margin:0;overflow-wrap:anywhere}.date{display:flex;align-items:center;gap:9px;margin:22px 0 0;color:#c9d3e0;font-size:15px}.date svg{color:var(--gold)}.card{margin-top:30px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(150deg,#192334,#111925);box-shadow:var(--shadow);overflow:hidden}.card-inner{padding:clamp(23px,5vw,38px)}.section-label{font-size:13px;letter-spacing:.035em;color:var(--gold);font-weight:800;display:flex;gap:10px;align-items:center;margin:0 0 20px}.section-label:before{content:"";width:3px;height:15px;border-radius:9px;background:var(--gold)}.content{font-size:16px;line-height:2;white-space:pre-wrap;overflow-wrap:anywhere;color:#dce4ee}.content:empty:before{content:"등록된 내용이 없습니다.";color:var(--muted)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.action{border:1px solid #e9b45155;background:linear-gradient(135deg,#ffd875,#efad44);color:#251903;padding:14px 19px;min-height:49px;display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:13px;font-size:14px;font-weight:850;cursor:pointer;transition:transform .2s,filter .2s,border-color .2s;max-width:100%}.action.secondary{background:#202b3c;color:#eff3f9;border-color:#435166}.action:hover{transform:translateY(-2px);filter:brightness(1.07)}.action:active{transform:translateY(0)}.action svg{width:18px;height:18px}.foot{margin-top:24px;text-align:center;color:#78869a;font-size:12px}.status{padding:18px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);line-height:1.8}.status.error{color:#ff9a9a;border-color:#91464a}
    .modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:clamp(9px,2vw,25px);background:#03070de8;backdrop-filter:blur(13px)}.modal.open{display:flex;animation:fade .2s ease}.dialog{display:flex;flex-direction:column;width:min(1100px,100%);max-height:calc(100dvh - 18px);border:1px solid #405069;border-radius:19px;background:#111926;box-shadow:0 26px 90px #000b;overflow:hidden}.modal-head{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:15px 17px;border-bottom:1px solid var(--line)}.modal-title{font-size:16px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.icon-btn{flex-shrink:0;width:38px;height:38px;display:grid;place-items:center;border:1px solid #425064;border-radius:11px;background:#202c3c;color:#f6f9ff;cursor:pointer}.icon-btn:hover{background:#32425a}.viewer{position:relative;display:flex;align-items:center;justify-content:center;flex:1;min-height:180px;overflow:hidden;padding:18px 62px;background:radial-gradient(circle at center,#202a3973,#0a111a);touch-action:none}.viewer img{cursor:grab;transform-origin:center center;will-change:transform;touch-action:none;display:block;max-width:100%;max-height:min(68dvh,850px);width:auto;height:auto;object-fit:contain;border-radius:5px;box-shadow:0 10px 30px #0006;user-select:none;-webkit-user-drag:none}.viewer .placeholder{color:#aebbd0;text-align:center;line-height:1.7}.nav{position:absolute;top:50%;transform:translateY(-50%);width:41px;height:49px;border:1px solid #56667c;background:#233044de;color:white;border-radius:12px;font-size:27px;cursor:pointer}.nav.prev{left:11px}.nav.next{right:11px}.nav[hidden]{display:none}.modal-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}.counter{font-variant-numeric:tabular-nums}.modal-note{opacity:.8}.lock-scroll{overflow:hidden}@keyframes fade{from{opacity:0}to{opacity:1}}@media(max-width:600px){.container{padding-top:51px;padding-bottom:55px;width:min(100% - 28px,790px)}.card{margin-top:23px;border-radius:19px}.content{font-size:15px;line-height:1.9}.actions{flex-direction:column}.action{width:100%}.dialog{max-height:calc(100dvh - 12px)}.modal{padding:6px}.viewer{padding:12px 45px}.viewer img{max-height:72dvh}.nav{width:34px;height:48px;border-radius:9px}.nav.prev{left:5px}.nav.next{right:5px}.modal-note{font-size:11px}}
    .schedule-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px;margin-top:28px}.schedule-list .card{margin:0;box-shadow:0 15px 40px #0004;display:flex;flex-direction:column}.schedule-list .card-inner{padding:25px;display:flex;flex-direction:column;height:100%}.subject-num{font-size:12px;font-weight:850;color:var(--gold);letter-spacing:.1em;margin-bottom:11px}.subject-title{font-size:clamp(21px,3vw,26px);font-weight:850;letter-spacing:-.05em;margin:0}.subject-date{color:#b7c6da;font-size:14px;margin:12px 0 0}.schedule-list .content{font-size:14px;line-height:1.85;margin-top:20px;flex:1}.schedule-list .actions{margin-top:20px}.schedule-list .action{width:100%;font-size:13px}.schedule-list .card:hover{border-color:#b18d5188;transition:border-color .2s}.empty-state{grid-column:1/-1}.hero-desc{color:var(--muted);font-size:15px;margin:18px 0 0;line-height:1.7}@media(max-width:650px){.schedule-list{grid-template-columns:1fr;gap:13px}.schedule-list .card-inner{padding:22px}.container{padding-top:48px}}
    .back-link{position:absolute;top:23px;left:max(18px,calc((100vw - 790px)/2));display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid #40506a;border-radius:12px;color:#dce6f4;text-decoration:none;background:#1a2535;font-size:13px;font-weight:750;transition:background .2s,transform .2s}.back-link:hover{background:#2a3950;transform:translateX(-2px)}.today-text{font-variant-numeric:tabular-nums}.title-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px}.date-badge{display:inline-flex;align-items:center;white-space:nowrap;padding:5px 10px;border-radius:9px;background:#2a3545;color:#c6d5e7;border:1px solid #40516a;font-size:12px;font-weight:800}.date-badge.tomorrow{background:#ffd36b;color:#241800;border-color:#ffe6a8;box-shadow:0 0 18px #ffd36b55;animation:tomorrow-pulse 2.4s ease-in-out infinite}.date-badge.today{background:#245843;border-color:#59b48a;color:#bfffe0}.date-badge.past{opacity:.8}.card.tomorrow-card{border-color:#d7aa53;box-shadow:0 0 0 1px #cfa04555,0 16px 45px #0005}@keyframes tomorrow-pulse{50%{box-shadow:0 0 26px #ffd36b91}}@media(max-width:650px){.back-link{top:14px;left:14px}.container{padding-top:90px}.date-badge{font-size:11px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  
    .viewer img.dragging{cursor:grabbing}
    .download-image{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 9px;border:1px solid #40536e;border-radius:9px;color:#d7e5ff;text-decoration:none;background:#202d40;font-size:12px;line-height:1;white-space:nowrap}
    .download-image:hover{background:#344963;color:white}
    .download-image svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .modal-bottom{position:relative}.modal-note{flex:1;text-align:center}
    @media(max-width:600px){.modal-note{display:none}.download-image{padding:8px 10px}}
  </style>
</head>
<body>
  <a class="back-link" href="../index.html" aria-label="상위 페이지로 돌아가기">← 뒤로가기</a>
  <main class="container">
    <section class="hero" aria-labelledby="pageTitle">
      <div class="eyebrow">ASSESSMENT SCHEDULE</div>
      <h1 id="pageTitle">수행평가 일정</h1>
      <p class="hero-desc" id="heroDesc">과목별 평가 일정과 내용을 확인하세요.</p>
      <p class="date" id="todayRow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span class="today-text" id="todayText"></span></p>
    </section>
    <div id="scheduleList" class="schedule-list" aria-live="polite"><div class="status">plan.js를 불러오는 중...</div></div>
    <div class="foot">INFORMATION BOARD</div>
  </main>
  <div class="modal" id="modal" role="presentation" aria-hidden="true">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><div class="modal-title" id="modalTitle">이미지 보기</div><button class="icon-btn" id="closeBtn" type="button" aria-label="닫기">✕</button></div>
      <div class="viewer" id="viewer"><button class="nav prev" id="prevBtn" type="button" aria-label="이전 이미지">‹</button><img id="modalImg" alt="" draggable="false"><div class="placeholder" id="imageStatus" hidden></div><button class="nav next" id="nextBtn" type="button" aria-label="다음 이미지">›</button></div>
      <div class="modal-bottom"><span class="counter" id="counter">1 / 1</span><a id="downloadImage" class="download-image" href="#" download aria-label="현재 이미지 다운로드" title="현재 이미지 다운로드"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg><span>저장</span></a></div>
    </div>
  </div>
  <script>window.__PLAN_JS_FAILED__ = false;</script>
  <script src="./plan.js" onerror="window.__PLAN_JS_FAILED__=true"></script>
  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const modal = $('modal'), img = $('modalImg'), imageStatus = $('imageStatus');
      let images = [], current = 0, previousFocus = null;
      const viewer=$('viewer'), downloadImage=$('downloadImage');
      const activePointers=new Map();
      let zoom=1, panX=0, panY=0, gesture=null, swipeStart=null;
      const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
      function clampPan(){
        const rect=viewer.getBoundingClientRect();
        const maxX=Math.max(0,(img.offsetWidth*zoom-rect.width+16)/2);
        const maxY=Math.max(0,(img.offsetHeight*zoom-rect.height+16)/2);
        panX=clamp(panX,-maxX,maxX);panY=clamp(panY,-maxY,maxY);
      }
      function drawZoom(){clampPan();img.style.transform=`translate3d(${panX}px,${panY}px,0) scale(${zoom})`;}
      function resetZoom(){zoom=1;panX=0;panY=0;gesture=null;swipeStart=null;activePointers.clear();img.classList.remove('dragging');drawZoom();}
      // 확대 기준점(휠 위치 또는 두 손가락 중심)을 고정한다.
      function setZoom(next,cx,cy){
        next=clamp(next,1,6);
        const r=viewer.getBoundingClientRect();
        const ox=cx-(r.left+r.width/2),oy=cy-(r.top+r.height/2);
        const ratio=next/zoom;
        panX=ox-(ox-panX)*ratio;panY=oy-(oy-panY)*ratio;
        zoom=next;drawZoom();
      }
      const get = (obj, keys) => { for(const k of keys){if(Object.prototype.hasOwnProperty.call(obj,k))return obj[k];}return undefined;};
      const imageList = value => (Array.isArray(value) ? value : [value]).filter(v => typeof v === 'string' && v.trim() && v.trim().toLowerCase() !== 'false');
      function addAction(label, urls, secondary, target){
        if(!urls.length)return;
        const btn = document.createElement('button');
        btn.type = 'button'; btn.className = secondary ? 'action secondary' : 'action';
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>';
        btn.append(document.createTextNode(label));
        btn.addEventListener('click', () => openModal(label,urls));
        target.append(btn);
      }
      function openModal(title,urls){images=urls;current=0;previousFocus=document.activeElement;$('modalTitle').textContent=title;modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.classList.add('lock-scroll');updateImage();$('closeBtn').focus();}
      function closeModal(){resetZoom();modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.body.classList.remove('lock-scroll');img.removeAttribute('src');images=[];if(previousFocus && typeof previousFocus.focus==='function')previousFocus.focus();}
      function updateImage(){
        if(!images.length)return;
        resetZoom();img.hidden=false; imageStatus.hidden=true;
        img.alt = `${$('modalTitle').textContent} (${current+1}/${images.length})`;
        img.onerror=()=>{img.hidden=true;imageStatus.textContent='이미지를 불러오지 못했습니다.\n경로와 파일명을 확인해주세요.';imageStatus.style.whiteSpace='pre-line';imageStatus.hidden=false;};
        img.onload=()=>{img.hidden=false;imageStatus.hidden=true;};
        img.src=images[current];
        downloadImage.href=images[current];
        const filename=decodeURIComponent(images[current].split('/').pop().split('?')[0] || `image-${current+1}.jpg`);
        downloadImage.setAttribute('download',filename);
        $('counter').textContent=`${current+1} / ${images.length}`;
        $('prevBtn').hidden=images.length<=1;$('nextBtn').hidden=images.length<=1;
      }
      function move(step){if(!images.length)return;current=(current+step+images.length)%images.length;updateImage();}
      $('closeBtn').addEventListener('click',closeModal);
      $('prevBtn').addEventListener('click',()=>move(-1));
      $('nextBtn').addEventListener('click',()=>move(1));
      modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
      document.addEventListener('keydown',e=>{
        if(!modal.classList.contains('open'))return;
        if(e.key==='Escape')closeModal();else if(e.key==='ArrowLeft'){e.preventDefault();move(-1);}else if(e.key==='ArrowRight'){e.preventDefault();move(1);}
        else if(e.key==='Tab'){const focusables=[$('closeBtn'),...(images.length>1?[$('prevBtn'),$('nextBtn')]:[])];const idx=focusables.indexOf(document.activeElement);if(e.shiftKey&&idx<=0){e.preventDefault();focusables[focusables.length-1].focus();}else if(!e.shiftKey&&idx===focusables.length-1){e.preventDefault();focusables[0].focus();}}
      });
      viewer.addEventListener('wheel',e=>{
        if(!modal.classList.contains('open')||img.hidden)return;
        e.preventDefault();
        setZoom(zoom*Math.exp(-e.deltaY*0.002),e.clientX,e.clientY);
      },{passive:false});
      viewer.addEventListener('pointerdown',e=>{
        if(e.target.closest('button') || img.hidden || (e.pointerType==='mouse'&&e.button!==0))return;
        viewer.setPointerCapture(e.pointerId);
        activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
        if(activePointers.size===1){
          gesture={x:e.clientX,y:e.clientY,panX,panY,moved:false};
          swipeStart={x:e.clientX,y:e.clientY,time:Date.now()};
        }else if(activePointers.size===2){
          const [a,b]=[...activePointers.values()];
          gesture={pinch:true,dist:Math.hypot(a.x-b.x,a.y-b.y),zoom,midX:(a.x+b.x)/2,midY:(a.y+b.y)/2,panX,panY};
          swipeStart=null;
        }
        img.classList.add('dragging');
      });
      viewer.addEventListener('pointermove',e=>{
        if(!activePointers.has(e.pointerId))return;
        activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
        if(activePointers.size===2){
          const [a,b]=[...activePointers.values()];
          const dist=Math.hypot(a.x-b.x,a.y-b.y);
          if(!gesture?.pinch){gesture={pinch:true,dist,zoom,midX:(a.x+b.x)/2,midY:(a.y+b.y)/2,panX,panY};return;}
          // 줌 이전 상태에서 손가락 중심 이동과 배율 변화를 함께 반영.
          zoom=gesture.zoom;panX=gesture.panX;panY=gesture.panY;
          const midX=(a.x+b.x)/2,midY=(a.y+b.y)/2;
          setZoom(gesture.zoom*dist/Math.max(1,gesture.dist),gesture.midX,gesture.midY);
          panX+=midX-gesture.midX;panY+=midY-gesture.midY;drawZoom();
        }else if(activePointers.size===1&&gesture&&!gesture.pinch){
          const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;
          if(Math.hypot(dx,dy)>7)gesture.moved=true;
          if(zoom>1){panX=gesture.panX+dx;panY=gesture.panY+dy;drawZoom();}
        }
      });
      function endPointer(e){
        if(!activePointers.has(e.pointerId))return;
        const start=swipeStart;
        activePointers.delete(e.pointerId);
        if(activePointers.size===0){
          if(start&&zoom===1&&images.length>1){
            const dx=e.clientX-start.x,dy=e.clientY-start.y;
            if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)move(dx<0?1:-1);
          }
          gesture=null;swipeStart=null;img.classList.remove('dragging');
        }else if(activePointers.size===1){
          const p=[...activePointers.values()][0];
          gesture={x:p.x,y:p.y,panX,panY,moved:false};swipeStart=null;
        }
      }
      viewer.addEventListener('pointerup',endPointer);
      viewer.addEventListener('pointercancel',endPointer);
      viewer.addEventListener('lostpointercapture',endPointer);
      img.addEventListener('dblclick',e=>{e.preventDefault();setZoom(zoom>1?1:2.5,e.clientX,e.clientY);});
      window.addEventListener('resize',()=>{if(modal.classList.contains('open'))drawZoom();});
      const now = new Date();
      const today = new Date(now.getFullYear(),now.getMonth(),now.getDate());
      const weekdays=['일','월','화','수','목','금','토'];
      $('todayText').textContent=`오늘 ${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일 ${weekdays[today.getDay()]}요일`;
      const mondayOf = d => {const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x;};
      const diffDays = (a,b) => Math.round((Date.UTC(a.getFullYear(),a.getMonth(),a.getDate())-Date.UTC(b.getFullYear(),b.getMonth(),b.getDate()))/86400000);
      function parseScheduleDate(value){
        if(typeof value!=='string')return null;
        const m=value.match(/(?:(\d{4})\s*년\s*)?(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
        if(!m)return null;
        const month=Number(m[2]), day=Number(m[3]);
        if(month<1||month>12||day<1||day>31)return null;
        let year=m[1]?Number(m[1]):today.getFullYear();
        // 연도가 없는 학사 일정은 현재 연도 기준. 연말에 가까우면 다음 해 1~2월도 고려.
        if(!m[1]&&today.getMonth()>=10&&month<=2)year++;
        const d=new Date(year,month-1,day);
        return d.getFullYear()===year&&d.getMonth()===month-1&&d.getDate()===day?d:null;
      }
      function relativeBadge(dateString){
        const target=parseScheduleDate(dateString);
        if(!target)return null;
        const days=diffDays(target,today), weekOffset=Math.round(diffDays(mondayOf(target),mondayOf(today))/7);
        if(days===0)return {label:'오늘',state:'today'};
        if(days===1)return {label:'내일',state:'tomorrow'};
        if(days<0)return {label:`${-days}일 전`,state:'past'};
        if(weekOffset===0)return {label:`이번 주 ${weekdays[target.getDay()]}요일`,state:''};
        if(weekOffset===1)return {label:`다음 주 ${weekdays[target.getDay()]}요일`,state:''};
        return {label:`${days}일 후`,state:''};
      }
      function renderItem(data, index) {
        const card=document.createElement('article');card.className='card';
        const inner=document.createElement('div');inner.className='card-inner';
        const number=document.createElement('div');number.className='subject-num';number.textContent=`SUBJECT ${String(index+1).padStart(2,'0')}`;
        const title=document.createElement('h2');title.className='subject-title';title.textContent=String(get(data,['제목','title']) ?? `항목 ${index+1}`);
        const titleRow=document.createElement('div');titleRow.className='title-row';titleRow.append(title);
        const date=document.createElement('p');date.className='subject-date';
        const dateValue=get(data,['날짜','date']);
        date.textContent=dateValue===false || dateValue==null || String(dateValue).trim()==='' ? '일정 미정' : '◷  '+String(dateValue);
        const badge=relativeBadge(dateValue);
        if(badge){const el=document.createElement('span');el.className='date-badge '+badge.state;el.textContent=badge.label;titleRow.append(el);if(badge.state==='tomorrow')card.classList.add('tomorrow-card');}
        const content=document.createElement('div');content.className='content';content.textContent=String(get(data,['내용','content']) ?? '');
        const actions=document.createElement('div');actions.className='actions';
        addAction('평가 계획 보기',imageList(get(data,['계획표 이미지 url','계획표 이미지 URL','계획표 이미지','평가계획','evaluation_img','evaluation_image','plan_img'])),false,actions);
        const extraLabel=get(data,['assets']);const extras=imageList(get(data,['assets_imgs']));
        if(typeof extraLabel==='string'&&extraLabel.trim()&&extras.length)addAction(extraLabel.trim(),extras,true,actions);
        inner.append(number,titleRow,date,content,actions);card.append(inner);return card;
      }
      try {
        if(window.__PLAN_JS_FAILED__)throw Error('plan.js 파일을 불러오지 못했습니다.');
        const data=typeof plan !== 'undefined' ? plan : typeof PLAN !== 'undefined' ? PLAN : window.PLAN_DATA;
        if(!data || typeof data!=='object')throw Error('plan.js의 const plan 설정이 올바르지 않습니다.');
        const list=Array.isArray(data)?data:Array.isArray(data['목록'])?data['목록']:[data];
        const title=get(data,['제목','title']) ?? '수행평가 일정';
        $('pageTitle').textContent=String(title);document.title=String(title);
        const desc=get(data,['설명','description']);if(desc!==undefined)$('heroDesc').textContent=String(desc);
        const root=$('scheduleList');root.replaceChildren();
        if(!list.length){const msg=document.createElement('div');msg.className='status empty-state';msg.textContent='등록된 일정이 없습니다.';root.append(msg);}
        // 다가오는 평가 → 지난 평가(최근 순) → 날짜 미정 순으로 자동 정렬
        const sortedList = list
          .filter(item => item && typeof item === 'object')
          .map((item, originalIndex) => {
            const target = parseScheduleDate(get(item, ['날짜', 'date']));
            const remaining = target ? diffDays(target, today) : null;
            return { item, originalIndex, remaining };
          })
          .sort((a, b) => {
            const category = value => value === null ? 2 : value < 0 ? 1 : 0;
            const difference = category(a.remaining) - category(b.remaining);
            if (difference) return difference;
            // 앞으로 남은 일정: 가까운 날짜부터 / 지난 일정: 가장 최근부터
            if (a.remaining !== null && b.remaining !== null && a.remaining !== b.remaining) {
              return category(a.remaining) === 1 ? b.remaining - a.remaining : a.remaining - b.remaining;
            }
            return a.originalIndex - b.originalIndex;
          });
        sortedList.forEach(({item}, index) => root.append(renderItem(item, index)));
        const count=document.createElement('span');count.textContent=`총 ${list.length}개의 수행평가`;count.style.color='var(--gold)';$('heroDesc').append('  ·  ',count);
      } catch(error) {
        console.error(error);const msg=document.createElement('div');msg.className='status error empty-state';msg.textContent=`설정 오류: ${error.message}\nindex.html과 plan.js가 같은 폴더에 있는지 확인하세요.`;msg.style.whiteSpace='pre-line';$('scheduleList').replaceChildren(msg);
      }
    })();
  </script>
</body>
</html>
